name: CI

on:
  push:
    branches: [main, architecture]
  pull_request:
    branches: [main, architecture]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operations:
    name: Local configuration and install policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run check:toolchain
      - run: npm run test:ops
      - name: Validate collection supervision units without activating them
        run: systemd-analyze verify infra/monitoring/littora-collection-watch.{service,timer}

  images:
    name: Runtime image security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build runtime images
        run: |
          docker build -f apps/api/Dockerfile -t littora-api:ci .
          docker build --target inventories -f apps/api/Dockerfile -t littora-inventories:ci .
          docker run --rm littora-inventories:ci node -e "require('./apps/api/scripts/amenities.cjs')"
          docker run --rm -v "$PWD/scripts/test:/app/scripts/test:ro" littora-inventories:ci python3 scripts/test/test_territory_inventories.py
          docker build -f apps/web/Dockerfile.prod -t littora-web:ci .
          docker build --platform linux/amd64 -t littora-postgres:16.16-3.7.0-r2 infra/postgres
          docker build -t littora-redis:7.4.12-r1 infra/redis
          docker build -t littora-caddy:2.11.9-r2 infra/caddy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check out the schema-compatible rollback reference
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: e6c11951ecae3e20294d428eb6f0a0308fcb00c3 # architecture after PR 92
          path: rollback-reference
          persist-credentials: false
      - name: Build the reference API and web from tracked source only
        run: |
          set -o pipefail
          git -C rollback-reference archive HEAD | docker build --target api -f apps/api/Dockerfile -t littora-api:rollback-ci -
          git -C rollback-reference archive HEAD | docker build -f apps/web/Dockerfile.prod -t littora-web:rollback-ci -
      - name: Verify migrations, HTTPS and application rollback with post-upgrade writes
        run: node scripts/test-api-migrations.mjs
      - name: Install verified scanner
        run: |
          curl --fail --location --retry 3 --output /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf /tmp/trivy.tar.gz | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      - name: Scan runtime OS and packages
        run: |
          mkdir -p image-reports
          status=0
          for image in api web inventories; do
            /tmp/trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "image-reports/$image.json" "littora-$image:ci" || status=1
          done
          for entry in postgres:16.16-3.7.0-r2 redis:7.4.12-r1 caddy:2.11.9-r2; do
            name="${entry%%:*}"
            if /tmp/trivy image --image-src docker --scanners vuln --format json --output "image-reports/$name.json" "littora-$entry"; then
              node scripts/check-image-report.mjs "$name" "image-reports/$name.json" || status=1
            else
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() }}
        with:
          name: runtime-image-reports
          path: image-reports/
          retention-days: 7

  api:
    name: API build and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run check:toolchain
      - run: npm ci --no-audit --no-fund
      - run: npm run audit
      - run: npm run check:contracts
      - run: npm run test:api
      - run: git diff --exit-code -- package-lock.json

  web:
    name: Web build and responsive tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run check:toolchain
      - run: npm ci --no-audit --no-fund
      - run: npm run audit
      - run: npm run test:tooling --workspace apps/web
      - run: npm run build:web
      - run: npm exec -- playwright install --with-deps chromium firefox webkit
        working-directory: apps/web
      - run: npm run test:ui
      - run: git diff --exit-code -- package-lock.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  storage:
    name: PostGIS, Redis and restore smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://littora:test-only-password@127.0.0.1:55432/littora_ci_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: docker compose -f docker-compose.test.yml up --build --wait -d
      - run: npm run test:integration
        env:
          TEST_MEMBER_BROWSER: '1'
          TEST_STAFF_BROWSER: '1'
          PLAYWRIGHT_CHANNEL: chrome
      - name: Install backup tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age
      - name: Restore an encrypted disposable backup and compare its contents
        run: POSTGRES_CONTAINER=$(docker compose -f docker-compose.test.yml ps -q postgres) bash scripts/test-database-restore.sh
      - name: Restore Redis and execute a preserved BullMQ job
        run: REDIS_CONTAINER=$(docker compose -f docker-compose.test.yml ps -q redis) node scripts/test-redis-restore.mjs
      - if: always()
        run: docker compose -f docker-compose.test.yml down --volumes
