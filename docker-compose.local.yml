services:
  postgres:
    entrypoint: &private-entrypoint ["/bin/sh", "/usr/local/bin/littora-daemon"]
    command: [postgres]
    image: littora-postgres:16.16-3.7.0-r2
    platform: linux/amd64
    build: ./infra/postgres
    environment:
      POSTGRES_USER: littora
      POSTGRES_PASSWORD: littora
      POSTGRES_DB: littora
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - &private-log-filter ./infra/diagnostics/daemon.sh:/usr/local/bin/littora-daemon:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U littora -d littora"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    entrypoint: *private-entrypoint
    command: [redis-server]
    image: littora-redis:7.4.12-r1
    build: ./infra/redis
    volumes:
      - redisdata:/data
      - *private-log-filter
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    command: [node, scripts/database.cjs, migrate]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      API_PORT: 3000
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [node, dist/worker.js]
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "process.exit(Date.now()-Number(require('fs').readFileSync('/tmp/littora-weather-heartbeat')) < 120000 ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.local
    command: npm start -- --host 0.0.0.0 --poll 2000
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:4200"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/api-client:/app/packages/api-client:ro
      - workspace_node_modules:/app/node_modules
      - web_workspace_node_modules:/app/apps/web/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME}_pgdata}
    external: ${STORAGE_VOLUMES_EXTERNAL:-false}
  redisdata:
    name: ${REDIS_VOLUME:-${COMPOSE_PROJECT_NAME}_redisdata}
    external: ${STORAGE_VOLUMES_EXTERNAL:-false}
  workspace_node_modules:
  web_workspace_node_modules:
