services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: littora
      POSTGRES_PASSWORD: littora
      POSTGRES_DB: littora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.local
    command: npm start -- --host 0.0.0.0 --poll 2000
    ports:
      - "4200:4200"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
volumes:
  pgdata:
  web_node_modules:
