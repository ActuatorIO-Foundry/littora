services:
  postgres:
    image: littora-postgres:16.16-3.7.0-r1
    platform: linux/amd64
    build: ./infra/postgres
    environment:
      POSTGRES_USER: littora
      POSTGRES_PASSWORD: littora
      POSTGRES_DB: littora
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U littora -d littora"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: littora-redis:7.4.12-r1
    build: ./infra/redis
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      API_PORT: 3000
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      - postgres
      - redis
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.local
    command: npm start -- --host 0.0.0.0 --poll 2000
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:4200"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME}_pgdata}
    external: ${STORAGE_VOLUMES_EXTERNAL:-false}
  redisdata:
    name: ${REDIS_VOLUME:-${COMPOSE_PROJECT_NAME}_redisdata}
    external: ${STORAGE_VOLUMES_EXTERNAL:-false}
  web_node_modules:
