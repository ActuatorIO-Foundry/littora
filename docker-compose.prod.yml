services:
  postgres:
    image: littora-postgres:16.16-3.7.0-r1
    platform: linux/amd64
    build: ./infra/postgres
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
  redis:
    image: littora-redis:7.4.12-r1
    build: ./infra/redis
    volumes:
      - redisdata:/data
    restart: unless-stopped
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env.prod
    restart: unless-stopped
    depends_on: [postgres, redis]
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on: [api]
  caddy:
    image: littora-caddy:2.11.9-r1
    build: ./infra/caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    restart: unless-stopped
volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME}_pgdata}
    external: ${STORAGE_VOLUMES_EXTERNAL:-false}
  redisdata:
    name: ${REDIS_VOLUME:-${COMPOSE_PROJECT_NAME}_redisdata}
    external: ${STORAGE_VOLUMES_EXTERNAL:-false}
  caddy_data:
  caddy_config:
