services:
  postgres:
    image: littora-postgres:16.16-3.7.0-r1
    platform: linux/amd64
    build: ./infra/postgres
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: littora-redis:7.4.12-r1
    build: ./infra/redis
    volumes:
      - redisdata:/data
    restart: unless-stopped
  migrate:
    profiles: [tools]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env.prod
    command: [node, scripts/database.cjs, migrate]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env.prod
    restart: unless-stopped
    depends_on: [postgres, redis]
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on: [api]
  caddy:
    image: littora-caddy:2.11.9-r1
    build: ./infra/caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    restart: unless-stopped
volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME}_pgdata}
    external: ${STORAGE_VOLUMES_EXTERNAL:-false}
  redisdata:
    name: ${REDIS_VOLUME:-${COMPOSE_PROJECT_NAME}_redisdata}
    external: ${STORAGE_VOLUMES_EXTERNAL:-false}
  caddy_data:
  caddy_config:
