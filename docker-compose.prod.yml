services:
  postgres:
    image: littora-postgres:16.16-3.7.0-r1
    platform: linux/amd64
    build: ./infra/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: littora-redis:7.4.12-r1
    build: ./infra/redis
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck: &redis-health
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.prod
    command: [node, scripts/database.cjs, migrate]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.prod
    environment:
      NODE_ENV: production
      API_PORT: 3000
      CORS_ORIGIN: https://${DOMAIN:?DOMAIN required}
      REPORT_PROXY_IPV4: &proxy-ip "172.30.29.2"
      JOBS_REDIS_URL: redis://redis-jobs:6379
    networks: [default, proxy_api]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redis-jobs: {condition: service_healthy}
  redis-jobs:
    image: littora-redis:7.4.12-r1
    build: ./infra/redis
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    restart: unless-stopped
    healthcheck: *redis-health
    volumes:
      - jobsdata:/data
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [node, dist/worker.js]
    env_file: .env.prod
    environment:
      JOBS_REDIS_URL: redis://redis-jobs:6379
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redis-jobs: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "process.exit(Date.now()-Number(require('fs').readFileSync('/tmp/littora-weather-heartbeat')) < 120000 ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
  web:
    networks: [edge]
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
  caddy:
    image: littora-caddy:2.11.9-r1
    build: ./infra/caddy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required}
    networks:
      edge: {}
      proxy_api: {ipv4_address: *proxy-ip}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_healthy}
    restart: unless-stopped
networks:
  default: {}
  edge: {}
  proxy_api:
    internal: true
    ipam:
      config:
        - subnet: 172.30.29.0/29
volumes:
  jobsdata:
  pgdata:
    name: ${POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME}_pgdata}
    external: ${STORAGE_VOLUMES_EXTERNAL:-false}
  redisdata:
    name: ${REDIS_VOLUME:-${COMPOSE_PROJECT_NAME}_redisdata}
    external: ${STORAGE_VOLUMES_EXTERNAL:-false}
  caddy_data:
  caddy_config:
