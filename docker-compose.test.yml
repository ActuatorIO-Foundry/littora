name: littora-tests

services:
  postgres:
    image: littora-postgres:16.16-3.7.0-r2
    platform: linux/amd64
    build: ./infra/postgres
    environment:
      POSTGRES_USER: littora
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: littora_ci_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U littora -d littora_ci_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: littora-redis:7.4.12-r1
    build: ./infra/redis
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
